[main]
# Waybar ile aynı font ve boyut
font=JetBrainsMono Nerd Font:size=13:weight=bold
prompt="❯ "
icon-theme=Papirus-Dark
lines=10
width=40
horizontal-pad=20
vertical-pad=15
inner-pad=5
line-height=24
layer=top

[colors]
# DİKKAT: Fuzzel renkleri RGBA (rrggbbaa) formatında hex olarak alır.
# Son iki harf (cc, ff, 66 vb.) saydamlığı belirler.

background=0f0f17cc       # Waybar arka planı (Koyu lacivert/gri, %80 saydam)
text=ffffffff             # Beyaz metin
match=00f2ffff            # Arama eşleşmesi vurgusu (Cam göbeği/Cyan)
selection=2d2d3ccc        # Seçili öğe arka planı (Modül arka planı rengi)
selection-text=ffffffff   # Seçili öğe metni
selection-match=ff0055ff  # Seçili öğedeki eşleşme vurgusu (Ölümcül Kırmızı/Pembe)
border=ff005566           # Çerçeve rengi (Kırmızı/Pembe, yarı saydam)

[border]
width=2
radius=12                 # Waybar ile aynı köşe yuvarlaması
