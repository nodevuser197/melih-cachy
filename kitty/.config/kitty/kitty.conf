# ==========================================
# FONTLAR (Powerlevel10k & İkonlar İçin)
# ==========================================
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
text_composition_strategy legacy

# ==========================================
# GÖRÜNÜM VE PENCERE
# ==========================================
background_opacity 0.80
dynamic_background_opacity yes
window_padding_width 8

# Sekme (Tab) çubuğu tasarımı
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge bottom
tab_bar_margin_width 0.0
active_tab_font_style bold

# ==========================================
# PERFORMANS (CachyOS / Düşük Gecikme)
# ==========================================
repaint_delay 8
input_delay 1
sync_to_monitor yes
wayland_enable_ime no

# ==========================================
# DÜZENLER (Layouts)
# ==========================================
# Bölme işlemlerinin (split) çalışması için zorunlu
enabled_layouts splits, stack, fat, tall, grid

# ==========================================
# KISAYOLLAR (TRQ Klavye Uyumlu)
# Sembol gerektiren tuşlardan kaçınıldı:
#   \ = AltGr+-  |  = = Shift+0  →  bunlar yerine harf/ok/F tuşları
# ==========================================

# --- Bölme (Split) ---
# ctrl+alt+v  →  dikey bölme (yan yana)   [v = vertical]
# ctrl+alt+s  →  yatay bölme (alt alta)   [s = split/aşağı]
map ctrl+alt+v  launch --location=vsplit --cwd=current
map ctrl+alt+s  launch --location=hsplit --cwd=current

# --- Pencere Açma / Kapatma ---
map ctrl+shift+enter  new_window_with_cwd
map ctrl+shift+w      close_window

# --- Pencereler Arası Geçiş (ok tuşları) ---
map ctrl+left   neighboring_window left
map ctrl+right  neighboring_window right
map ctrl+up     neighboring_window up
map ctrl+down   neighboring_window down

# --- Pencereler Arası Geçiş (vim tarzı: hjkl) ---
map ctrl+shift+h  neighboring_window left
map ctrl+shift+j  neighboring_window down
map ctrl+shift+k  neighboring_window up
map ctrl+shift+l  neighboring_window right

# --- Pencere Boyutlandırma (ctrl+alt+ok) ---
map ctrl+alt+left   resize_window narrower 2
map ctrl+alt+right  resize_window wider    2
map ctrl+alt+up     resize_window taller   2
map ctrl+alt+down   resize_window shorter  2
map ctrl+alt+r      resize_window reset

# --- Pencere Taşıma (ctrl+shift+alt+ok) ---
map ctrl+shift+alt+left   move_window left
map ctrl+shift+alt+right  move_window right
map ctrl+shift+alt+up     move_window up
map ctrl+shift+alt+down   move_window down

# --- Zoom / Maksimize ---
# Aktif pencereyi tam ekrana al (toggle stack layout)
map ctrl+shift+z  toggle_layout stack

# --- Layout Döngüsü ---
map ctrl+shift+space  next_layout

# --- Sekmeler (Tabs) ---
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+q    close_tab
map ctrl+tab        next_tab
map ctrl+shift+tab  previous_tab
map ctrl+shift+n    set_tab_title

# Numarayla hızlı geçiş (alt+1..9)
map alt+1  goto_tab 1
map alt+2  goto_tab 2
map alt+3  goto_tab 3
map alt+4  goto_tab 4
map alt+5  goto_tab 5
map alt+6  goto_tab 6
map alt+7  goto_tab 7
map alt+8  goto_tab 8
map alt+9  goto_tab 9

# --- Yazı Boyutu ---
map ctrl+f1          change_font_size all -1.0
map ctrl+f2          change_font_size all +1.0
map ctrl+f3          change_font_size all 0
map ctrl+shift+asterisk  change_font_size all +1.0

# --- Scrollback / Geçmiş ---
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+end       scroll_end
# fzf ile scrollback'te arama
map ctrl+shift+f  launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --exact -i

# --- Pano (Clipboard) ---
map ctrl+shift+c  copy_to_clipboard
map ctrl+shift+v  paste_from_clipboard

# ==========================================
# RENK ŞEMASI (Tokyo Night Dark)
# ==========================================
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #283457
cursor #c0caf5
cursor_text_color #1a1b26

# Normal Renkler
color0 #15161e
color1 #f7768e
color2 #9ece6a
color3 #e0af68
color4 #7aa2f7
color5 #bb9af7
color6 #7dcfff
color7 #a9b1d6

# Parlak Renkler
color8 #414868
color9 #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5
